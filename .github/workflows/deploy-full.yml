name: Deploy Full

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: "payments-api"
      pr_id:
        description: PR ID
        required: false
        default: "unknown"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mock Google Cloud auth
        run: |
          echo "MOCK: skipping Google Cloud authentication"
          echo "MOCK: no project access in this environment"

      - name: Mock full deploy
        env:
          SERVICE: ${{ inputs.service }}
          PR_ID: ${{ inputs.pr_id }}
        run: |
          echo "MOCK: would promote $SERVICE to 100% traffic"
          echo "MOCK: PR $PR_ID"
          echo "MOCK: full deployment succeeded in demo mode"