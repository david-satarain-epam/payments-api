name: Monitor Canary

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Monitoring duration in minutes
        required: true
        default: "5"
      service:
        description: Service to monitor
        required: true
        default: "payments-api"
      pr_id:
        description: PR ID
        required: false
        default: "unknown"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mock Google Cloud auth
        run: |
          echo "MOCK: skipping Google Cloud authentication"
          echo "MOCK: monitoring in demo mode"

      - name: Mock canary monitoring
        env:
          SERVICE: ${{ inputs.service }}
          DURATION: ${{ inputs.duration_minutes }}
          PR_ID: ${{ inputs.pr_id }}
        run: |
          echo "MOCK: monitoring $SERVICE for $DURATION minutes"
          echo "MOCK: PR $PR_ID"
          echo "MOCK: all metrics are healthy in demo mode"