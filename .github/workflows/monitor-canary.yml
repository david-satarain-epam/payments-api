name: Monitor Canary

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Monitoring duration in minutes
        required: true
        default: "5"
      service:
        description: Service to monitor
        required: true
        default: "payments-api"
      pr_id:
        description: PR ID
        required: false
        default: "unknown"

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check service health
        env:
          SERVICE: ${{ inputs.service }}
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          echo "Monitoring $SERVICE for $DURATION minutes..."
          gcloud run services describe "$SERVICE" --region us-east1 --format="value(status.url)"
          echo "Canary monitor step complete"