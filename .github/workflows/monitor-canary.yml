name: Monitor Canary

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Cloud Run service name"
        required: true
        type: string
      duration_minutes:
        description: "Monitoring duration"
        required: true
        default: "5"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Monitor service
        run: |
          echo "Monitoring ${{ inputs.service }}"
          echo "Duration: ${{ inputs.duration_minutes }} minutes"

          gcloud run services describe "${{ inputs.service }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="table(status.url,status.traffic)"

          sleep $(( ${{ inputs.duration_minutes }} * 60 ))