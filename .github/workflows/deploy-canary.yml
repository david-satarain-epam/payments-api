name: Deploy Canary

on:
  workflow_dispatch:
    inputs:
      percentage:
        description: Canary percentage
        required: true
        default: "10"
      service:
        description: Service name
        required: true
        default: "payments-api"
      pr_id:
        description: PR ID
        required: false
        default: "unknown"

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mock GCP auth
        run: |
          echo "MOCK: skipping Google Cloud authentication"
          echo "MOCK: no GCP project or org access in this environment"
          echo "MOCK: running in demonstration mode"

      - name: Compute traffic split
        env:
          CANARY_PERCENT: ${{ inputs.percentage }}
        run: |
          canary="${CANARY_PERCENT}"
          stable=$((100 - canary))
          echo "CANARY_PERCENT=$canary" >> "$GITHUB_ENV"
          echo "STABLE_PERCENT=$stable" >> "$GITHUB_ENV"
          echo "Canary traffic: ${canary}%"
          echo "Stable traffic: ${stable}%"

      - name: Mock Cloud Run deployment
        env:
          SERVICE: ${{ inputs.service }}
          PR_ID: ${{ inputs.pr_id }}
        run: |
          echo "MOCK: would deploy service '$SERVICE' to Cloud Run"
          echo "MOCK: PR ID = $PR_ID"
          echo "MOCK: canary split = ${CANARY_PERCENT}% / ${STABLE_PERCENT}%"
          echo "MOCK: Cloud Run canary deployment succeeded (demo mode)"