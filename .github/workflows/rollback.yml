name: Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to rollback
        required: true
        default: "payments-api"
      rollback_version:
        description: Revision or tag to rollback to
        required: false
        default: "previous"

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mock Google Cloud auth
        run: |
          echo "MOCK: skipping Google Cloud authentication"
          echo "MOCK: rollback in demo mode"

      - name: Mock rollback
        env:
          SERVICE: ${{ inputs.service }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          echo "MOCK: would roll back $SERVICE to $ROLLBACK_VERSION"
          echo "MOCK: traffic restored to stable revision in demo mode"