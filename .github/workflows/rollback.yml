name: Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to rollback
        required: true
        default: "payments-api"
      rollback_version:
        description: Revision/tag to rollback to
        required: false
        default: "previous"

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Roll back traffic
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.rollback_version }}
        run: |
          if [ "$VERSION" = "previous" ]; then
            echo "Rolling back to previous revision"
            gcloud run services update-traffic "$SERVICE" --region us-east1 --to-revisions=previous=100
          else
            echo "Rolling back to revision $VERSION"
            gcloud run services update-traffic "$SERVICE" --region us-east1 --to-revisions="$VERSION=100"
          fi