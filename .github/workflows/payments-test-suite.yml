name: Payments Test Suite

on:
  workflow_dispatch:
    inputs:
      pr_id:
        description: PR ID
        required: false
        default: "unknown"
      test_plan:
        description: Test plan
        required: false
        default: "unit,integration"

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Report results
        if: always()
        run: |
          echo "PR: ${{ inputs.pr_id }}"
          echo "Test plan: ${{ inputs.test_plan }}"