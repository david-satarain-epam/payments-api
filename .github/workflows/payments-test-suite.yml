name: Payments Test Suite

on:
  workflow_dispatch:
    inputs:
      test_plan:
        description: 'Tests to execute'
        required: true
        type: string
      pr_id:
        description: 'Pull Request ID'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Report results
        if: always()
        run: |
          echo "PR: ${{ inputs.pr_id }}"
          echo "Test plan: ${{ inputs.test_plan }}"
