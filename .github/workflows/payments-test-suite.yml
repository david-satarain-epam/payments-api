name: Payments Test Suite

on:
  workflow_dispatch:
    inputs:
      pr_id:
        description: PR ID
        required: false
        default: "unknown"
      test_plan:
        description: Test plan
        required: false
        default: "unit,integration"

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run unit and integration tests
        run: |
          echo "PR: ${{ inputs.pr_id }}"
          echo "Test plan: ${{ inputs.test_plan }}"
          npm test -- --runInBand